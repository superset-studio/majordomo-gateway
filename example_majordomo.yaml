server:
  host: "0.0.0.0"
  port: 7680
  base_url: ""  # Public URL of the gateway (e.g., "https://gateway.example.com"). Used for OAuth callbacks. Defaults to http://localhost:{port}
  read_timeout: 30s
  write_timeout: 120s

storage:
  driver: postgres
  postgres:
    host: localhost
    port: 5432
    user: ""        # Or set MAJORDOMO_STORAGE_POSTGRES_USER
    password: ""    # Or set MAJORDOMO_STORAGE_POSTGRES_PASSWORD
    database: majordomo
    sslmode: disable
    max_conns: 20

logging:
  level: "info"  # "debug", "info", "warn", "error"
  store_request_body: false
  store_response_body: false
  max_body_size: 65536  # Only used for postgres storage
  body_storage: "none"  # "none", "postgres", "s3"

s3:
  enabled: false
  bucket: ""
  region: "us-east-1"
  endpoint: ""  # Leave empty for AWS, set for MinIO/LocalStack (e.g., "http://localhost:9000")
  access_key_id: ""      # Or set MAJORDOMO_S3_ACCESS_KEY_ID
  secret_access_key: ""  # Or set MAJORDOMO_S3_SECRET_ACCESS_KEY

pricing:
  remote_url: "https://www.llm-prices.com/current-v1.json"
  refresh_interval: 1h
  fallback_file: "./pricing.json"
  aliases_file: "./model_aliases.json"

secrets:
  encryption_key: ""  # 32-byte hex-encoded AES-256 key. Required for proxy keys. Generate with: openssl rand -hex 32

providers:
  openai:
    base_url: "https://api.openai.com"
  anthropic:
    base_url: "https://api.anthropic.com"
  gemini:
    base_url: "https://generativelanguage.googleapis.com"
  bedrock:
    region: "us-east-1"

# Web UI (optional) — set jwt.secret to enable admin API endpoints
jwt:
  secret: ""      # Required to enable web UI. Use a random string (>= 32 chars): openssl rand -base64 32
  expiry: 24h

cors:
  allowed_origins: []  # e.g., ["http://localhost:6785"] for Vite dev server

# OAuth (optional) — enable GitHub and/or Google sign-in for the web UI
oauth:
  frontend_url: ""  # URL to redirect to after OAuth (defaults to gateway URL). e.g., "http://localhost:6785"
  # github:
  #   client_id: ""      # Or set MAJORDOMO_OAUTH_GITHUB_CLIENT_ID
  #   client_secret: ""  # Or set MAJORDOMO_OAUTH_GITHUB_CLIENT_SECRET
  # google:
  #   client_id: ""      # Or set MAJORDOMO_OAUTH_GOOGLE_CLIENT_ID
  #   client_secret: ""  # Or set MAJORDOMO_OAUTH_GOOGLE_CLIENT_SECRET

# Email (optional) — enable password reset emails via Resend
email:
  resend_api_key: ""      # Or set MAJORDOMO_EMAIL_RESEND_API_KEY
  from: ""                # Or set MAJORDOMO_EMAIL_FROM (e.g., "Majordomo <no-reply@yourdomain.com>")
  frontend_url: ""        # Or set MAJORDOMO_EMAIL_FRONTEND_URL (used to build reset links)

# Experiments (A/B testing) — disabled by default
# When enabled, experiments are managed via the Admin API.
# experiments:
#   enabled: false          # Or set MAJORDOMO_EXPERIMENTS_ENABLED=true
#   cache_ttl: 5m           # How long to cache active experiments (default: 5m)
