[project]
name = "replay"
version = "0.1.0"
description = "Replay logged LLM requests against cheaper models and compare outputs"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.42.50",
    "majordomo-llm>=0.3.0",
    "pyyaml>=6.0.3",
    "rich>=14.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
majordomo-llm = { path = "../../majordomo-llm", editable = true }
